name: EngiSense AI CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master


jobs:

  # ==========================================
  # Backend Tests
  # ==========================================
  backend-tests:
    name: Backend Tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18

        env:
          POSTGRES_DB: engisense_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d engisense_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx


      - name: Enable pgvector
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d engisense_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"


      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engisense_test
          SECRET_KEY: test-secret-key
          ENVIRONMENT: testing
        run: |
          alembic upgrade head


      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/engisense_test
          SECRET_KEY: test-secret-key
          ENVIRONMENT: testing
          HF_TOKEN: ""
          LLM_MODEL: openai/gpt-oss-120b
        run: |
          pytest tests -v


  # ==========================================
  # Frontend Build
  # ==========================================
  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8000
        run: |
          npm run build


  # ==========================================
  # Docker Build
  # ==========================================
  docker-build:
    name: Docker Build

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Docker images
        run: |
          docker compose build